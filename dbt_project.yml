name: 'nubank_purchase_analysis'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  nubank_purchase_analysis:

    +catalog: nubank_analysis
    
    01_staging:
      +materialized: view
      +schema: bronze

    02_intermediate:
      +materialized: view
      +schema: silver

    03_marts:
      +materialized: table
      +schema: gold